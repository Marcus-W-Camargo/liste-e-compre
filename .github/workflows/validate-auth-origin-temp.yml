name: Validar origem auth temporariamente
on:
  push:
    branches: [fix/auth-origin-production]
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Node tests
        run: node --test tests/*.test.mjs
      - name: Vitest
        if: always()
        run: npx vitest run
      - name: TypeScript
        if: always()
        run: npx tsc -b
      - name: Build
        if: always()
        run: npm run build
      - name: Lint
        if: always()
        run: npm run lint
