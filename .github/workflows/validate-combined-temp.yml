name: Validação temporária bundle combinado

on:
  push:
    branches: [perf/route-splitting-background-webp]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/route-splitting-background-webp
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - if: always()
        run: npm run lint
      - if: always()
        run: npm test
