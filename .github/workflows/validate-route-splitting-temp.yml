name: Validação temporária route splitting

on:
  push:
    branches: [perf-route-code-splitting]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf-route-code-splitting
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Build
        run: npm run build
      - name: Lint
        if: always()
        run: npm run lint
      - name: Testes
        if: always()
        run: npm test
      - name: Bundle Analyzer
        if: always()
        run: npm run analyze
      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-report-route-splitting
          path: dist/bundle-report.html
          if-no-files-found: error
          retention-days: 7
