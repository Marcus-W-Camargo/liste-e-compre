name: Exporta background WebP temporariamente

on:
  push:
    branches: [perf/route-splitting-background-webp]

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/route-splitting-background-webp
      - uses: actions/upload-artifact@v4
        with:
          name: background-webp
          path: src/assets/background.webp
          if-no-files-found: error
