name: Aplicar correções finais anti-enumeração

on:
  push:
    branches:
      - seguranca-lgpd

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seguranca-lgpd
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Aplicar correções mínimas
        run: python .github/final_security_patch.py
      - run: npm ci
      - name: Node tests
        run: node --test tests/*.test.mjs
      - name: Vitest completo
        continue-on-error: true
        run: npx vitest run
      - name: Vitest da Conta alterada
        run: npx vitest run tests/Conta.test.tsx
      - name: TypeScript
        run: npx tsc -b
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Commitar apenas a correção final
        shell: bash
        run: |
          git config user.name "Marcus Camargo"
          git config user.email "75137005+Marcus-W-Camargo@users.noreply.github.com"
          git rm .github/workflows/final-seguranca-lgpd.yml .github/final_security_patch.py
          git add server/auth-controller.mjs src/pages/Conta.tsx tests/auth.test.mjs tests/auth-enumeration.test.mjs tests/Conta.test.tsx
          git commit -m "fix: fecha canais finais de enumeração"
          git push origin HEAD:seguranca-lgpd
