name: Inspeciona background temporariamente

on:
  push:
    branches: [perf/route-splitting-background-webp]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/route-splitting-background-webp
      - name: Inspecionar dimensoes e borda direita
        run: |
          set -euo pipefail
          echo '=== Arquivos ==='
          file src/assets/background.png src/assets/background.webp
          identify src/assets/background.png src/assets/background.webp
          echo '=== Estatisticas PNG - 30 px direita ==='
          convert src/assets/background.png -gravity East -crop 30x0+0+0 +repage -format 'mean=%[fx:mean] stddev=%[fx:standard_deviation] entropy=%[entropy]\n' info:
          echo '=== Estatisticas WEBP - 30 px direita ==='
          convert src/assets/background.webp -gravity East -crop 30x0+0+0 +repage -format 'mean=%[fx:mean] stddev=%[fx:standard_deviation] entropy=%[entropy]\n' info:
          echo '=== Estatisticas WEBP - 60 px direita ==='
          convert src/assets/background.webp -gravity East -crop 60x0+0+0 +repage -format 'mean=%[fx:mean] stddev=%[fx:standard_deviation] entropy=%[entropy]\n' info:
          echo '=== Cores dominantes ultimos 30 px WEBP ==='
          convert src/assets/background.webp -gravity East -crop 30x0+0+0 +repage -colors 8 -format %c histogram:info:- | sort -nr | head -10
