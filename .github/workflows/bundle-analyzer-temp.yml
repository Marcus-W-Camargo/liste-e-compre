name: Bundle analyzer temporário

on:
  push:
    branches: [chore-bundle-analyzer-node24]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore-bundle-analyzer-node24
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Sincronizar lockfile e instalar dependências
        run: npm install
      - name: Persistir package-lock atualizado
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: atualiza lockfile do analisador"
            git push origin HEAD:chore-bundle-analyzer-node24
          fi
      - name: Gerar relatório HTML do bundle
        env:
          ANALYZE: 'true'
        run: npm run build
      - name: Localizar relatório
        run: find . -maxdepth 3 -type f \( -name 'bundle-report.html' -o -name 'bundle-report*.html' \) -print
      - name: Publicar relatório
        uses: actions/upload-artifact@v4
        with:
          name: bundle-report-html
          path: bundle-report.html
          if-no-files-found: error
          retention-days: 7
